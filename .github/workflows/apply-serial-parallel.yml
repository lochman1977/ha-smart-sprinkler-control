name: Apply serial and parallel schedules

on:
  workflow_dispatch:
  push:
    branches:
      - feature/serial-parallel-schedules
    paths:
      - tools/apply_serial_parallel.py
      - .github/workflows/apply-serial-parallel.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/serial-parallel-schedules
          fetch-depth: 0

      - name: Normalize create schedule matcher
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/apply_serial_parallel.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          marker = next(
              i for i, line in enumerate(lines)
              if '"create schedule fields"' in line
          )

          start = marker
          while start >= 0 and lines[start].strip() != "text = replace_once(":
              start -= 1
          if start < 0:
              raise RuntimeError("Start of create schedule matcher not found")

          end = marker
          while end < len(lines) and lines[end].strip() != ")":
              end += 1
          if end >= len(lines):
              raise RuntimeError("End of create schedule matcher not found")

          replacement = '''text = replace_once(
              text,
              "            enabled=call.data.get(\\"enabled\\", True),\\n"
              "            zone_durations=call.data.get(\\"zone_durations\\", {}),\\n",
              "            enabled=call.data.get(\\"enabled\\", True),\\n"
              "            zone_durations=call.data.get(\\"zone_durations\\", {}),\\n"
              "            execution_mode=call.data.get(\\"execution_mode\\", \\"serial\\"),\\n"
              "            zone_delay_seconds=call.data.get(\\"zone_delay_seconds\\", 5),\\n",
              "create schedule fields",
          )'''.splitlines()

          lines[start:end + 1] = replacement
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Replaced matcher block at lines {start + 1}-{end + 1}")
          PY

      - name: Validate migration script syntax
        run: python -m py_compile tools/apply_serial_parallel.py

      - name: Apply source changes
        run: python tools/apply_serial_parallel.py

      - name: Validate Python syntax
        run: python -m compileall custom_components/smart_sprinkler_control

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify generated changes
        run: |
          git diff --check
          git status --short

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components frontend/src frontend/dist
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "Add serial and parallel schedule execution"
          git push origin HEAD:feature/serial-parallel-schedules
