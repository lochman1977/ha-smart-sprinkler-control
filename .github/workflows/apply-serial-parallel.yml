name: Apply serial and parallel schedules

on:
  workflow_dispatch:
  push:
    branches:
      - feature/serial-parallel-schedules
    paths:
      - tools/apply_serial_parallel.py
      - .github/workflows/apply-serial-parallel.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/serial-parallel-schedules
          fetch-depth: 0

      - name: Patch migration script for current constructor order
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/apply_serial_parallel.py")
          text = path.read_text(encoding="utf-8")

          old = '''    "            zone_durations=call.data.get(\"zone_durations\", {}),\\n"
              "            enabled=call.data.get(\"enabled\", True),\\n",
              "            zone_durations=call.data.get(\"zone_durations\", {}),\\n"
              "            execution_mode=call.data.get(\"execution_mode\", \"serial\"),\\n"
              "            zone_delay_seconds=call.data.get(\"zone_delay_seconds\", 5),\\n"
              "            enabled=call.data.get(\"enabled\", True),\\n",'''

          new = '''    "            enabled=call.data.get(\"enabled\", True),\\n"
              "            zone_durations=call.data.get(\"zone_durations\", {}),\\n",
              "            enabled=call.data.get(\"enabled\", True),\\n"
              "            zone_durations=call.data.get(\"zone_durations\", {}),\\n"
              "            execution_mode=call.data.get(\"execution_mode\", \"serial\"),\\n"
              "            zone_delay_seconds=call.data.get(\"zone_delay_seconds\", 5),\\n",'''

          if old not in text:
              raise RuntimeError("Expected create-schedule matcher was not found")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          print("Migration matcher updated")
          PY

      - name: Apply source changes
        run: python tools/apply_serial_parallel.py

      - name: Validate Python syntax
        run: python -m compileall custom_components/smart_sprinkler_control

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify generated changes
        run: |
          git diff --check
          git status --short

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components frontend/src frontend/dist
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "Add serial and parallel schedule execution"
          git push origin HEAD:feature/serial-parallel-schedules
