name: Apply serial and parallel schedules

on:
  workflow_dispatch:
  push:
    branches:
      - feature/serial-parallel-schedules
    paths:
      - tools/apply_serial_parallel.py
      - .github/workflows/apply-serial-parallel.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/serial-parallel-schedules
          fetch-depth: 0

      - name: Normalize migration matcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("tools/apply_serial_parallel.py")
          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'text = replace_once\(\n'
              r'\s*text,\n'
              r'\s*"            zone_durations=call\.data\.get\(\\"zone_durations\\", \{\}\),\\n"\n'
              r'\s*"            enabled=call\.data\.get\(\\"enabled\\", True\),\\n",\n'
              r'\s*"            zone_durations=call\.data\.get\(\\"zone_durations\\", \{\}\),\\n"\n'
              r'\s*"            execution_mode=call\.data\.get\(\\"execution_mode\\", \\"serial\\"\),\\n"\n'
              r'\s*"            zone_delay_seconds=call\.data\.get\(\\"zone_delay_seconds\\", 5\),\\n"\n'
              r'\s*"            enabled=call\.data\.get\(\\"enabled\\", True\),\\n",\n'
              r'\s*"create schedule fields",\n'
              r'\)',
              re.S,
          )

          replacement = '''text = replace_once(
              text,
              "            enabled=call.data.get(\\"enabled\\", True),\\n"
              "            zone_durations=call.data.get(\\"zone_durations\\", {}),\\n",
              "            enabled=call.data.get(\\"enabled\\", True),\\n"
              "            zone_durations=call.data.get(\\"zone_durations\\", {}),\\n"
              "            execution_mode=call.data.get(\\"execution_mode\\", \\"serial\\"),\\n"
              "            zone_delay_seconds=call.data.get(\\"zone_delay_seconds\\", 5),\\n",
              "create schedule fields",
          )'''

          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f"Could not normalize create-schedule matcher: {count} matches")

          path.write_text(text, encoding="utf-8")
          print("Migration matcher normalized")
          PY

      - name: Validate migration script syntax
        run: python -m py_compile tools/apply_serial_parallel.py

      - name: Apply source changes
        run: python tools/apply_serial_parallel.py

      - name: Validate Python syntax
        run: python -m compileall custom_components/smart_sprinkler_control

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify generated changes
        run: |
          git diff --check
          git status --short

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components frontend/src frontend/dist
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "Add serial and parallel schedule execution"
          git push origin HEAD:feature/serial-parallel-schedules
